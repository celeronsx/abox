apiVersion: v1
kind: Namespace
metadata:
  name: llama-cpp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-embeddings
    spec:
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b10920
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8090"
            - --embeddings
            - --ctx-size
            - "16384"
            - --ubatch-size
            - "2048"
            - --parallel
            - "8"
            - -hf
            - nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0
          ports:
            - containerPort: 8090
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: llama-cpp-embeddings
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llamacpp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: llama-cpp-embeddings
          port: 8090
